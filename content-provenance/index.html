<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Content Provenance, Access and Attribution</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f3ed; --panel: #fdfbf7; --canvas: #f1ede5; --fg: #22252b; --muted: #6e6860; --line: #e2dcd1; --edge: #cdc5b8;
    --chip: #ebe5da; --sel: #e6ecf6; --accent: #2f5f9e; --priv: #f8eed6; --priv-line: #e6d3a6;
    --l-provenance: #3a6db4; --l-access: #c0582f; --l-licensing: #7d5ba6; --l-attribution: #4d8a3a;
    --l-payments: #9a6d12; --l-identity: #1f8796; --l-governance: #847c70;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #14161b; --panel: #1a1d23; --canvas: #111317; --fg: #e7e3db; --muted: #9b958b; --line: #2b2f37; --edge: #3a3f49;
    --chip: #252930; --sel: #1f2a3b; --accent: #8db2f0; --priv: #282419; --priv-line: #4a4128;
    --l-provenance: #7fa7e6; --l-access: #ea8b65; --l-licensing: #b39bdc; --l-attribution: #8ec476;
    --l-payments: #e2b65e; --l-identity: #5ec3d1; --l-governance: #aaa398;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #14161b; --panel: #1a1d23; --canvas: #111317; --fg: #e7e3db; --muted: #9b958b; --line: #2b2f37; --edge: #3a3f49;
      --chip: #252930; --sel: #1f2a3b; --accent: #8db2f0; --priv: #282419; --priv-line: #4a4128;
      --l-provenance: #7fa7e6; --l-access: #ea8b65; --l-licensing: #b39bdc; --l-attribution: #8ec476;
      --l-payments: #e2b65e; --l-identity: #5ec3d1; --l-governance: #aaa398;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  header { padding: 14px 16px; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .filters { background: var(--panel); }
  #theme { margin-left: auto; }
  header h1 { font-size: 17px; margin: 0 16px 0 0; }
  input[type=search] { flex: 1 1 220px; padding: 6px 10px; font: inherit; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
  label { color: var(--muted); font-size: 13px; }
  .filters { padding: 8px 16px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 6px; }
  .chip, .vbtn { font: inherit; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--chip); border: 1px solid transparent; cursor: pointer; color: var(--fg); }
  .chip.on, .vbtn.on { border-color: var(--accent); color: var(--accent); }
  .vbtn { font-size: 13px; padding: 3px 12px; }
  main { display: grid; grid-template-columns: minmax(260px, 380px) 1fr; min-height: calc(100vh - 110px); }
  main.graph { grid-template-columns: 1fr minmax(280px, 440px); }
  main.graph #list { display: none; }
  #list { border-right: 1px solid var(--line); overflow-y: auto; max-height: calc(100vh - 110px); }
  .item { padding: 10px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .item:hover { background: var(--chip); }
  .item.sel { background: var(--sel); box-shadow: inset 3px 0 0 var(--accent); }
  .item .n { font-weight: 600; }
  .item .t { color: var(--muted); font-size: 12px; }
  #graphwrap { display: none; position: relative; background: var(--canvas); border-right: 1px solid var(--line); height: calc(100vh - 110px); }
  main.graph #graphwrap { display: block; }
  #graph { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; user-select: none; }
  #graph:active { cursor: grabbing; }
  .edge { stroke: var(--edge); stroke-width: 1; }
  .edge.on { stroke: var(--accent); stroke-width: 1.8; }
  .edge.fade { opacity: .2; }
  .node circle { stroke: var(--canvas); stroke-width: 1.5; cursor: pointer; }
  .node text { font-size: 11px; fill: var(--fg); display: none; pointer-events: none; paint-order: stroke; stroke: var(--canvas); stroke-width: 3px; }
  .node.lab text { display: block; }
  .node.fade { opacity: .3; }
  .node.dim { opacity: .08; }
  .node.sel circle { stroke: var(--fg); stroke-width: 2.5; }
  .legend { position: absolute; left: 10px; bottom: 10px; font-size: 12px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
  .legend span { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }
  .hint { position: absolute; right: 10px; bottom: 10px; font-size: 12px; color: var(--muted); }
  #detail { padding: 16px 24px; overflow-y: auto; max-height: calc(100vh - 110px); }
  #detail h2 { margin: 0 0 4px; }
  .meta { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  .meta a { color: var(--accent); }
  #detail h3 { font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 20px 0 6px; }
  #detail a.wl { color: var(--accent); text-decoration: none; border-bottom: 1px dotted; }
  #detail a.wl.missing { color: #c33; }
  code { background: var(--chip); padding: 0 4px; border-radius: 3px; font-size: 13px; }
  .private { background: var(--priv); border: 1px solid var(--priv-line); border-radius: 6px; padding: 4px 14px 10px; margin-top: 20px; }
  #detail strong { font-weight: 600; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  ul { padding-left: 20px; }
  @media (max-width: 720px) {
    main, main.graph { grid-template-columns: 1fr; }
    #list { max-height: 40vh; border-right: 0; border-bottom: 1px solid var(--line); }
    #graphwrap { height: 60vh; border-right: 0; border-bottom: 1px solid var(--line); }
    .hint { display: none; }
    #detail { max-height: none; padding: 16px; }
  }
</style>
</head>
<body>
<header>
  <h1>Content Provenance, Access and Attribution</h1>
  <button class="vbtn" id="v-list">List</button>
  <button class="vbtn" id="v-graph">Graph</button>
  <input type="search" id="q" placeholder="Search names, aliases, topics">
  <label id="privwrap" hidden><input type="checkbox" id="priv"> private notes</label>
  <button class="vbtn" id="theme" title="Colour theme">Auto</button>
</header>
<div class="filters" id="filters"></div>
<main id="main">
  <div id="list"></div>
  <div id="graphwrap">
    <svg id="graph"></svg>
    <div class="legend" id="legend"></div>
    <div class="hint">Click a node to open it. Drag to move, scroll to zoom.</div>
  </div>
  <div id="detail"></div>
</main>
<script src="data.js"></script>
<script src="private.js" onerror="window.PRIVATE = null"></script>
<script>
const cards = window.CARDS || [];
const byId = Object.fromEntries(cards.map(c => [c.id, c]));
const active = new Set();
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|([^\]]*))?\]\]/g, (_, id, label) => {
      id = id.trim();
      const c = byId[id];
      return `<a class="wl${c ? "" : " missing"}" href="#${encodeURIComponent(id)}">${esc(label || (c ? c.name : id))}</a>`;
    })
    .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}

function block(text) {
  const out = []; let list = null;
  for (const line of text.split("\n")) {
    const li = line.match(/^\s*-\s+(.*)$/);
    if (li) { if (!list) { list = []; out.push(list); } list.push(li[1]); continue; }
    list = null;
    if (line.trim()) out.push(line);
  }
  return out.map(b => Array.isArray(b) ? `<ul>${b.map(i => `<li>${inline(i)}</li>`).join("")}</ul>` : `<p>${inline(b)}</p>`).join("");
}

function haystack(c) {
  return [c.name, c.id, ...c.aliases, c.status, c.summary, ...c.sections.map(s => s.text), ...c.tags].join(" ").toLowerCase();
}

const selected = () => decodeURIComponent(location.hash.slice(1));

function renderFilters() {
  const tags = [...new Set(cards.flatMap(c => c.tags))].sort();
  $("filters").innerHTML = tags.map(t => `<span class="chip${active.has(t) ? " on" : ""}" data-t="${esc(t)}">${esc(t)}</span>`).join("");
}

function visible() {
  const q = $("q").value.trim().toLowerCase();
  return cards.filter(c => [...active].every(t => c.tags.includes(t)) && (!q || haystack(c).includes(q)));
}

function renderList() {
  const sel = selected();
  const v = visible();
  $("list").innerHTML = v.map(c => `<div class="item${c.id === sel ? " sel" : ""}" data-id="${c.id}"><div class="n">${esc(c.name)}</div><div class="t">${esc(c.type)}${c.status ? " · " + esc(c.status) : ""}</div></div>`).join("") || `<div class="item t">No matches</div>`;
}

function renderDetail() {
  const c = byId[selected()];
  if (!c) { $("detail").innerHTML = `<p class="meta">${cards.length} cards. Pick one, search, or filter by tag.</p>`; return; }
  const parent = c.part_of ? ` · part of ${inline(`[[${c.part_of}]]`)}` : "";
  const site = c.website ? ` · <a href="${esc(c.website)}" target="_blank" rel="noopener">${esc(c.website.replace(/^https?:\/\//, ""))}</a>` : "";
  let h = `<h2>${esc(c.name)}</h2><div class="meta">${esc(c.type)}${parent}${site}`;
  if (c.aliases.length) h += `<br>Also: ${esc(c.aliases.join(", "))}`;
  if (c.status) h += `<br>Status: ${esc(c.status)}`;
  if (c.updated) h += ` (updated ${esc(c.updated)})`;
  h += `<div class="tags">${c.tags.map(t => `<span class="chip" data-t="${esc(t)}">${esc(t)}</span>`).join("")}</div></div>`;
  h += block(c.summary);
  for (const s of c.sections) h += `<h3>${esc(s.title)}</h3>${block(s.text)}`;
  if (c.backlinks.length) h += `<h3>Linked from</h3><ul>${c.backlinks.map(b => `<li>${inline(`[[${b}]]`)}</li>`).join("")}</ul>`;
  const p = window.PRIVATE && $("priv").checked && window.PRIVATE[c.id];
  if (p) h += `<div class="private"><h3>Private</h3>${block(p.summary)}${p.sections.map(s => `<h3>${esc(s.title)}</h3>${block(s.text)}`).join("")}</div>`;
  $("detail").innerHTML = h;
}

// Graph view: a small force layout drawn in SVG.
const SVG = "http://www.w3.org/2000/svg";
const LAYERS = ["provenance", "access", "licensing", "attribution", "payments", "identity", "governance"];
const view = { x: 0, y: 0, k: 1 };
let G = null, graphOn = false, running = false, hover = null, drag = null;

function layerOf(c) {
  const t = c.tags.find(t => t.startsWith("layer/"));
  return t ? t.slice(6) : "governance";
}

function mk(tag, parent, attrs = {}) {
  const e = document.createElementNS(SVG, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e);
  return e;
}

function initGraph() {
  const nodes = cards.map((c, i) => {
    const a = (i / cards.length) * Math.PI * 2;
    return { id: c.id, c, x: Math.cos(a) * 300, y: Math.sin(a) * 300, vx: 0, vy: 0, deg: 0 };
  });
  const idx = Object.fromEntries(nodes.map(n => [n.id, n]));
  const seen = new Set(), edges = [];
  for (const c of cards) for (const l of c.links) {
    if (!idx[l]) continue;
    const key = [c.id, l].sort().join("|");
    if (seen.has(key)) continue;
    seen.add(key);
    edges.push({ s: idx[c.id], t: idx[l] });
    idx[c.id].deg++; idx[l].deg++;
  }
  G = { nodes, edges, idx, alpha: 1 };

  const svg = $("graph");
  svg.innerHTML = "";
  const vp = mk("g", svg, { id: "vp" });
  const eg = mk("g", vp), ng = mk("g", vp);
  for (const e of edges) e.el = mk("line", eg, { class: "edge" });
  for (const n of nodes) {
    n.r = 4 + Math.sqrt(n.deg) * 2.2;
    n.el = mk("g", ng, { class: "node" });
    n.el.dataset.id = n.id;
    mk("circle", n.el, { r: n.r, fill: `var(--l-${layerOf(n.c)})` });
    const t = mk("text", n.el, { x: n.r + 3, y: 4 });
    t.textContent = n.c.name;
  }
  $("legend").innerHTML = LAYERS.map(l => `<div><span style="background:var(--l-${l})"></span>${l}</div>`).join("");

  for (let i = 0; i < 250; i++) tick();
  fit();
}

function tick() {
  const { nodes, edges, alpha: a } = G;
  for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {
    const p = nodes[i], q = nodes[j];
    let dx = q.x - p.x, dy = q.y - p.y;
    const d2 = dx * dx + dy * dy || 0.01, d = Math.sqrt(d2), f = (2200 / d2) * a;
    dx /= d; dy /= d;
    p.vx -= dx * f; p.vy -= dy * f; q.vx += dx * f; q.vy += dy * f;
  }
  for (const e of edges) {
    let dx = e.t.x - e.s.x, dy = e.t.y - e.s.y;
    const d = Math.sqrt(dx * dx + dy * dy) || 0.01, f = (d - 70) * 0.02 * a;
    dx /= d; dy /= d;
    e.s.vx += dx * f; e.s.vy += dy * f; e.t.vx -= dx * f; e.t.vy -= dy * f;
  }
  for (const n of nodes) {
    n.vx -= n.x * 0.006 * a; n.vy -= n.y * 0.006 * a;
    if (n.fixed) { n.vx = n.vy = 0; continue; }
    n.vx *= 0.6; n.vy *= 0.6;
    n.x += n.vx; n.y += n.vy;
  }
  G.alpha *= 0.985;
}

function fit() {
  const svg = $("graph"), w = svg.clientWidth || 800, h = svg.clientHeight || 600;
  const xs = G.nodes.map(n => n.x), ys = G.nodes.map(n => n.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  view.k = Math.min(1.6, w / (maxX - minX + 160), h / (maxY - minY + 80));
  view.x = -((minX + maxX) / 2) * view.k;
  view.y = -((minY + maxY) / 2) * view.k;
}

function draw() {
  const svg = $("graph");
  $("vp").setAttribute("transform", `translate(${svg.clientWidth / 2 + view.x},${svg.clientHeight / 2 + view.y}) scale(${view.k})`);
  for (const e of G.edges) {
    e.el.setAttribute("x1", e.s.x); e.el.setAttribute("y1", e.s.y);
    e.el.setAttribute("x2", e.t.x); e.el.setAttribute("y2", e.t.y);
  }
  for (const n of G.nodes) n.el.setAttribute("transform", `translate(${n.x},${n.y})`);
}

function styleGraph() {
  if (!G) return;
  const vis = new Set(visible().map(c => c.id));
  const sel = selected(), focus = hover || sel;
  const nb = new Set();
  if (G.idx[focus]) {
    nb.add(focus);
    for (const e of G.edges) {
      if (e.s.id === focus) nb.add(e.t.id);
      if (e.t.id === focus) nb.add(e.s.id);
    }
  }
  for (const n of G.nodes) {
    const cls = ["node"];
    if (!vis.has(n.id)) cls.push("dim");
    else if (nb.size && !nb.has(n.id)) cls.push("fade");
    if (n.id === sel) cls.push("sel");
    if (nb.has(n.id) || n.deg >= 7) cls.push("lab");
    n.el.setAttribute("class", cls.join(" "));
  }
  for (const e of G.edges) {
    const on = nb.size && (e.s.id === focus || e.t.id === focus);
    const off = !vis.has(e.s.id) || !vis.has(e.t.id) || (nb.size && !on);
    e.el.setAttribute("class", "edge" + (on ? " on" : "") + (off ? " fade" : ""));
  }
}

function loop() {
  if (!graphOn) { running = false; return; }
  if (G.alpha > 0.01) tick();
  draw();
  if (G.alpha > 0.01 || drag) requestAnimationFrame(loop);
  else running = false;
}

function kick(a) {
  G.alpha = Math.max(G.alpha, a);
  if (!running) { running = true; requestAnimationFrame(loop); }
}

function toWorld(e) {
  const r = $("graph").getBoundingClientRect();
  return { x: (e.clientX - r.left - r.width / 2 - view.x) / view.k, y: (e.clientY - r.top - r.height / 2 - view.y) / view.k };
}

const svgEl = $("graph");
svgEl.addEventListener("pointerdown", e => {
  const g = e.target.closest(".node");
  svgEl.setPointerCapture(e.pointerId);
  drag = { node: g ? G.idx[g.dataset.id] : null, sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y, moved: false };
  if (drag.node) drag.node.fixed = true;
});
svgEl.addEventListener("pointermove", e => {
  if (!drag) {
    const g = e.target.closest(".node"), id = g ? g.dataset.id : null;
    if (id !== hover) { hover = id; styleGraph(); }
    return;
  }
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
  if (drag.node) {
    const p = toWorld(e);
    drag.node.x = p.x; drag.node.y = p.y;
    kick(0.3);
  } else {
    view.x = drag.vx + dx; view.y = drag.vy + dy;
    kick(0);
  }
});
svgEl.addEventListener("pointerup", () => {
  if (!drag) return;
  const d = drag;
  drag = null;
  if (d.node) {
    d.node.fixed = false;
    if (!d.moved) location.hash = d.node.id;
  }
});
svgEl.addEventListener("pointerleave", () => { if (hover && !drag) { hover = null; styleGraph(); } });
svgEl.addEventListener("wheel", e => {
  e.preventDefault();
  const r = svgEl.getBoundingClientRect();
  const px = e.clientX - r.left - r.width / 2 - view.x, py = e.clientY - r.top - r.height / 2 - view.y;
  const k = Math.min(4, Math.max(0.2, view.k * Math.exp(-e.deltaY * 0.0015)));
  const s = k / view.k;
  view.x -= px * (s - 1); view.y -= py * (s - 1); view.k = k;
  kick(0);
}, { passive: false });
window.addEventListener("resize", () => { if (graphOn) kick(0); });

function setView(v) {
  graphOn = v === "graph";
  $("main").classList.toggle("graph", graphOn);
  $("v-list").classList.toggle("on", !graphOn);
  $("v-graph").classList.toggle("on", graphOn);
  store.set("cpaa-view", v);
  if (graphOn) {
    if (!G) initGraph();
    styleGraph();
    kick(0);
  }
}

function render() { renderFilters(); renderList(); renderDetail(); styleGraph(); }

document.addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (chip) { const t = chip.dataset.t; active.has(t) ? active.delete(t) : active.add(t); render(); return; }
  const item = e.target.closest(".item[data-id]");
  if (item) location.hash = item.dataset.id;
});
$("v-list").addEventListener("click", () => setView("list"));
$("v-graph").addEventListener("click", () => setView("graph"));
$("q").addEventListener("input", () => { renderList(); styleGraph(); });
window.addEventListener("hashchange", () => { renderList(); renderDetail(); styleGraph(); });
if (window.PRIVATE) {
  $("privwrap").hidden = false;
  $("priv").checked = store.get("cpaa-priv") === "1";
  $("priv").addEventListener("change", () => { store.set("cpaa-priv", $("priv").checked ? "1" : "0"); renderDetail(); });
}
const THEMES = ["auto", "light", "dark"];
function setTheme(t) {
  if (t === "auto") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = t;
  $("theme").textContent = t[0].toUpperCase() + t.slice(1);
  store.set("cpaa-theme", t);
}
$("theme").addEventListener("click", () => {
  const cur = store.get("cpaa-theme") || "auto";
  setTheme(THEMES[(THEMES.indexOf(cur) + 1) % THEMES.length]);
});
setTheme(THEMES.includes(store.get("cpaa-theme")) ? store.get("cpaa-theme") : "auto");
render();
setView(store.get("cpaa-view") === "graph" ? "graph" : "list");
</script>
</body>
</html>
