<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" role="img" aria-labelledby="scf-title scf-desc">
  <title id="scf-title">Blob with skill cards under three catalog regimes</title>
  <desc id="scf-desc">A sketchy blob full of eyes holds three groups of skill cards: a crowded uncapped pile with one card tumbling out, uniform cards with descriptions cut short by dots, and cards shrinking to name-only stubs with a dashed omitted stub and a warning triangle.</desc>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .fA { animation: scf-boilA .9s steps(1) infinite; }
      .fB { animation: scf-boilB .9s steps(1) infinite; }
      .eye { transform-box: fill-box; transform-origin: center; animation: scf-blink 8.4s ease-in-out infinite; }
      .fall { transform-box: fill-box; transform-origin: center; animation: scf-fall 5.5s ease-in-out infinite; }
      .breathe { animation: scf-breathe 3.4s ease-in-out infinite; }
      .pulse { animation: scf-pulse 2.6s ease-in-out infinite; }
    }
    @keyframes scf-boilA { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes scf-boilB { 0%, 49% { opacity: 0; } 50%, 100% { opacity: 1; } }
    @keyframes scf-blink { 0%, 95.5%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.08); } 98.5% { transform: scaleY(1); } }
    @keyframes scf-fall { 0% { transform: translate(2px,-30px) rotate(0deg); opacity: 0; } 18% { opacity: .45; } 78% { transform: translate(-5px,14px) rotate(-6deg); opacity: .45; } 100% { transform: translate(-7px,26px) rotate(-8deg); opacity: 0; } }
    @keyframes scf-breathe { 0%, 100% { opacity: .45; } 50% { opacity: .12; } }
    @keyframes scf-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
  </style>
